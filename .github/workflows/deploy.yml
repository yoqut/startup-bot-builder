name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Testlar ──────────────────────────────────────────────────────────────
  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: botbuilder_test
          POSTGRES_USER: botbuilder
          POSTGRES_PASSWORD: testpass
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://botbuilder:testpass@localhost:5432/botbuilder_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-secret-key-for-ci-only-not-production
          ENCRYPTION_KEY: dGVzdC1lbmNyeXB0aW9uLWtleS0zMi1jaGFycw==
          BOT_TOKEN_ENCRYPTION_KEY: dGVzdC1ib3Qta2V5LWZvci1jaS10ZXN0aW5nWA==
          WEBHOOK_BASE_URL: http://localhost:8000
          CORS_ORIGINS: http://localhost:3000
          DEBUG: "false"
        run: uv run pytest tests/ -q --tb=short

  # ── 2. Frontend build ───────────────────────────────────────────────────────
  build-frontend:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install & type check
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit

  # ── 3. Deploy (faqat main branch ga push bo'lganda) ─────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/constructor
            git pull origin main
            docker compose -f docker/docker-compose.yml build
            docker compose -f docker/docker-compose.yml up -d
            docker compose -f docker/docker-compose.yml exec -T backend uv run alembic upgrade head
            docker image prune -f
            echo "✅ Deploy muvaffaqiyatli: $(date)"
