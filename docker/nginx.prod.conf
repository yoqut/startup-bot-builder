server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# yoqutdigital.uz → frontend.yoqutdigital.uz ga redirect
server {
    listen 443 ssl;
    server_name yoqutdigital.uz;

    ssl_certificate     /etc/letsencrypt/live/yoqutdigital.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yoqutdigital.uz/privkey.pem;

    return 301 https://frontend.yoqutdigital.uz$request_uri;
}

# Frontend — frontend.yoqutdigital.uz
server {
    listen 443 ssl;
    server_name frontend.yoqutdigital.uz;

    ssl_certificate     /etc/letsencrypt/live/frontend.yoqutdigital.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frontend.yoqutdigital.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    client_max_body_size 50M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(js|css|png|jpg|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_buffering    off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Backend API — backend.yoqutdigital.uz
server {
    listen 443 ssl;
    server_name backend.yoqutdigital.uz;

    ssl_certificate     /etc/letsencrypt/live/backend.yoqutdigital.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backend.yoqutdigital.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    client_max_body_size 50M;

    location /webhook/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_buffering    off;
    }
}
